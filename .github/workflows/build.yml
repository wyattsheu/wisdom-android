name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動按按鈕編譯

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wisdom-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 固定網址用：每次都覆蓋同一個 tag，方便直接用 .../releases/download/latest/app-debug.apk
      # 抓到最新版；上面那個 run-N 才是保留歷史版本、可回頭比對用的。
      - name: Publish to Releases (latest alias)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
